name: Link Check

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

jobs:
  link-check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --exclude "^mailto:"
            --exclude "^tel:"
            --timeout 30
            --retry-wait-time 5
            --max-retries 3
            https://sarahspeakspolicy.com/
          fail: true
