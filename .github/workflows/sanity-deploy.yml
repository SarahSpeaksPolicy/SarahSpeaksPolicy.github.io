name: Deploy Sanity Studio

on:
  push:
    branches: [ main ]
    paths:
      - "sanity/**"
      - ".github/workflows/sanity-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Sanity dependencies
        run: cd sanity && npm ci --legacy-peer-deps

      - name: Deploy Sanity Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: cd sanity && npm run deploy
