name: Deploy to GitHub Pages

on:
  # Triggered by a Sanity webhook (content publish)
  repository_dispatch:
    types: [sanity-update]

  # Also runs on every push to main (code changes)
  push:
    branches: [main]

  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify n8n webhook
        if: always()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$COMMIT_MESSAGE" ]; then
            COMMIT_MESSAGE="$COMMIT_SHA"
          fi
          export COMMIT_MESSAGE

          python3 - <<'PY' > payload.json
          import json
          import os

          payload = {
              "message": os.getenv("COMMIT_MESSAGE", ""),
              "author": "n8n",
              "title": "Sarah published new content on the website!",
              "url": "https://sarahspeakspolicy.com/",
              "commitId": os.getenv("COMMIT_SHA", "")
          }

          print(json.dumps(payload))
          PY

          curl -X POST "https://n8n.mkg-hz.com/webhook/452869ea-bbb1-4f8f-b0c5-dc4f5c4c812c" \
            -H "Content-Type: application/json" \
            --data @payload.json
